---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Renders the shared dashboards with the mise tasks (nothing generated is
# committed), validates the bundle on PRs, and publishes it from main as a signed
# OCI artifact (ghcr.io/<repo>/o11y-manifests:main), the same shape the tenant
# bundles use. See o11y/README.md.
name: o11y

on:
  push:
    branches:
      - main
    paths:
      - o11y/**
      - .github/workflows/o11y.yml
      - .mise/config.toml
  pull_request:
    paths:
      - o11y/**
      - .github/workflows/o11y.yml
      - .mise/config.toml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/o11y-manifests
  MISE_AUTO_INSTALL: 'false'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: --locked yq sd kustomize
          cache: false

      - name: Render
        run: mise run //:o11y:render

      - name: Bundle builds
        run: kustomize build o11y/manifests > /dev/null

  push:
    name: Publish
    needs: validate
    # Only main may publish and sign; blocks workflow_dispatch on arbitrary
    # branches from minting tags.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: --locked yq sd jq flux2 github:sigstore/cosign
          cache: false

      - name: Render
        run: mise run //:o11y:render

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and sign
        run: |
          set -euo pipefail
          digest_url=$(flux push artifact "oci://${IMAGE}:${GITHUB_REF_NAME}" \
            --path=o11y/manifests \
            --source="https://github.com/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output json | jq -r '.repository + "@" + .digest')
          cosign sign --yes "${digest_url}"
