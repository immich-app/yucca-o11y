---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.changed-files.outputs.manifests_any_modified }}
      tooling: ${{ steps.changed-files.outputs.tooling_any_modified }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            manifests:
              - kubernetes/**
            tooling:
              - .mise/config.toml
              - .github/workflows/flate.yaml

  flate:
    if: ${{ needs.filter.outputs.manifests == 'true' || needs.filter.outputs.tooling == 'true' }}
    needs: filter
    name: Flate - ${{ matrix.cluster }} - ${{ matrix.resource }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: ["staging", "production"]
        resource: ["helmrelease", "kustomization"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flate
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked github:home-operations/flate

      - name: Restore Flate Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flate
          key: flate-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flate-${{ runner.os }}-${{ runner.arch }}-

      # Changed-only mode renders just the resources whose manifests changed, which
      # keeps unchanged ghcr bundles (anonymous pulls, 429-prone) out of most runs.
      # Tooling changes touch no manifests, so they test the full tree instead.
      - name: Run Flate
        env:
          FLATE_PATH: ./kubernetes/clusters/${{ matrix.cluster }}
          FLATE_CACHE_DIR: ${{ runner.temp }}/flate
          FLATE_BASE: ${{ needs.filter.outputs.tooling != 'true' && github.event.repository.default_branch || '' }}
          KIND: ${{ matrix.resource }}
        run: flate test $KIND

  success:
    if: ${{ !cancelled() }}
    needs:
      - flate
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
