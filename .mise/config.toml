monorepo_root = true

[monorepo]
config_roots = ["deployment", "deployment/modules/*/*", "docs"]

[tools]
opentofu = "1.12.5"
terragrunt = "1.1.1"
python = "3.14.6"
uv = "0.11.32"
pipx = "1.16.2"
"pipx:python-openstackclient" = "10.2.1"
kubectl = "1.36.2"
flux2 = "2.9.2"
"sd" = "1.1.0"
talosctl = "1.13.7"
helm = "4.2.3"
"jq" = "1.8.2"
gh = "2.96.0"
yq = "4.53.3"
"kustomize" = "5.8.1"
markdownlint-cli2 = "0.23.1"
"github:home-operations/flate" = "v0.4.12"

[env]
# In a subproject task {{config_root}} is that subproject's directory, so
# repo-root paths have to come from here, where it still means the repo root.
REPO_ROOT = "{{config_root}}"

TF_VAR_dist_dir = "{{config_root}}/dist"

# Maps long env names (development/staging/production) to the short suffixes
# used by 1Password vault paths (dev/staging/prod).
ENVIRONMENT_SHORT = "{% set e = get_env(name='ENVIRONMENT', default='development') %}{% if e == 'development' or e == '' %}dev{% elif e == 'production' %}prod{% else %}{{ e }}{% endif %}"

# CI authenticates with a service-account token, which op rejects alongside --account.
[tasks.tg]
run = "op run {% if get_env(name='OP_SERVICE_ACCOUNT_TOKEN', default='') == '' %}--account 'team-futo.1password.com' {% endif %}'--env-file={{config_root}}/deployment/.env' -- terragrunt"
description = "Wrapper for terragrunt"
dir = "{{cwd}}"

# Every module gets the same five terragrunt tasks. dir = {{config_root}} lands
# terragrunt in the module directory, replacing the old --working-dir flag.
[task_templates."tg:init"]
run = "mise run //:tg run init -- -reconfigure"
description = "Init this module"
dir = "{{config_root}}"

[task_templates."tg:plan"]
run = "mise run //:tg run plan"
description = "Plan this module"
dir = "{{config_root}}"

[task_templates."tg:apply"]
run = "mise run //:tg run apply"
description = "Apply this module"
dir = "{{config_root}}"

[task_templates."tg:destroy"]
run = "mise run //:tg run destroy"
description = "Destroy this module"
dir = "{{config_root}}"

[task_templates."tg:output"]
run = "mise run //:tg run output --"
description = "Read outputs from this module"
dir = "{{config_root}}"

[settings]
experimental = true
idiomatic_version_file_enable_tools = []
