# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: bootstrap-settings
                optional: true
              - kind: ConfigMap
                name: cluster-settings
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: _
              spec:
                install:
                  crds: CreateReplace
                rollback:
                  cleanupOnFail: true
                upgrade:
                  cleanupOnFail: true
                  crds: CreateReplace
                  strategy:
                    name: RemediateOnFailure
                  remediation:
                    remediateLastFailure: true
                    retries: 2
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
