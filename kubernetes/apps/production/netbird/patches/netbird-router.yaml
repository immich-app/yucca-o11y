---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-router
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: netbird-router
        spec:
          template:
            spec:
              containers:
                - name: netbird
                  # renovate: datasource=docker depName=netbirdio/netbird
                  image: netbirdio/netbird:0.80.0@sha256:4976692ea44bb93871743d0b742b4a8f97f6425bfc458ca2d78e28fdb8bdf4ad
      target:
        kind: Deployment
        name: netbird-router
