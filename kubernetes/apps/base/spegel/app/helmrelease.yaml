---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 1h
  values:
    service:
      registry:
        # Both ports must match the Talos spegel-registry firewall rule; the chart's
        # nodePort default (30020) does not. hostPort only applies to chart 0.7.x,
        # which production still pins.
        hostPort: 29999
        nodePort: 30021
    serviceMonitor:
      enabled: true
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
