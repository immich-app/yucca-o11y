---
# One webhook contact point per Grafana folder, each posting to that project's
# Rootly alert source on the project's service. The URL carries the source
# secret as a query parameter (Rootly reads it nowhere else). The notification
# title becomes the Rootly alert summary, so it stays stable between the
# firing and resolved notifications of the same group.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanacontactpoint_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: rootly-o11y
spec:
  resyncPeriod: 1h
  instanceSelector:
    matchLabels:
      dashboards: grafana
  name: rootly-o11y
  receivers:
    - type: webhook
      settings:
        httpMethod: POST
        title: |-
          {{ .CommonLabels.grafana_folder }} · {{ .CommonLabels.alertname }}{{ if .CommonLabels.cluster }} · {{ .CommonLabels.cluster }}{{ end }}
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: rootly-alerts-o11y
              key: url
