---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
# Fleet-wide rules: everything here queries the unscoped VictoriaMetrics
# Fleet datasource on purpose. Rules about this cluster's own health belong
# in alerts-o11y.yaml, which rides the (scoped) default datasource.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: o11y-fleet
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: o11y
  interval: 1m
  rules:
    # Keyed on vminsert's per-tenant counters, which live in o11y's own
    # tenant: the multitenant path stops returning a tenant that has ingested
    # nothing since UTC midnight, so a rule reading the silent cluster's own
    # history resolves at the first midnight of an outage. Account 0 is the
    # draining legacy tenant; account 5 (fmeet) and 6:2 (geoshenanigans'
    # geocoder) ship in bursts. The `or` selector is MetricsQL.
    - uid: o11y-cluster-silent
      title: o11y cluster stopped reporting
      condition: B
      for: 5m
      labels:
        project: o11y
        severity: critical
      annotations:
        summary: Tenant {{ $labels.accountID }}:{{ $labels.projectID }} ingested metrics within the last 7 days but nothing for 15m; its remote write path or the whole cluster may be down.
        description: The tenant registry in base/victoria-metrics/app/configmap-vminsert-relabel.yaml maps the tenant to its project and cluster. A whole remote cluster going dark silences every tenant it ships, so several tenants firing together usually share one cause.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ""
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (sum by (accountID, projectID) (increase(vm_tenant_inserted_rows_total{accountID!~"0|5|6" or accountID="6", projectID!="2"}[7d])) > 0)
              unless
              (sum by (accountID, projectID) (increase(vm_tenant_inserted_rows_total[15m])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ""
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params: [0]
                operator:
                  type: and
                query:
                  params: [A]
                reducer:
                  type: last
                  params: []
    - uid: o11y-external-secret-not-ready
      title: ExternalSecret not ready
      condition: B
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} in {{ $labels.cluster }} has not synced for 15m.
        description: Workloads keep the last synced copy, but rotated or new values stop arriving. When every ExternalSecret in a cluster fails together, its secret store is unreachable (on o11y, 1Password Connect at opc.o11y.futo.network over NetBird). A single failure usually means a missing or renamed 1Password item; kubectl describe the ExternalSecret for the error.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ""
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: max by (project, env, cluster, exported_namespace, name) (externalsecret_status_condition{condition="Ready",status="False"}) > 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ""
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params: [0]
                operator:
                  type: and
                query:
                  params: [A]
                reducer:
                  type: last
                  params: []
