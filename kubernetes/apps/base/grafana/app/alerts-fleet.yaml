---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
# Fleet-wide rules: everything here queries the unscoped VictoriaMetrics
# Fleet datasource on purpose. Rules about this cluster's own health belong
# in alerts-o11y.yaml, which rides the (scoped) default datasource.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: o11y-fleet
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: o11y
  interval: 1m
  rules:
    - uid: o11y-cluster-silent
      title: o11y cluster stopped reporting
      condition: B
      for: 15m
      labels:
        project: o11y
        severity: critical
      annotations:
        summary: Cluster {{ $labels.cluster }} reported metrics within the last day but has sent nothing recently; its remote write path may be down.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ""
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: count by (cluster) (up offset 1d) unless count by (cluster) (up)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ""
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params: [0]
                operator:
                  type: and
                query:
                  params: [A]
                reducer:
                  type: last
                  params: []
