---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafananotificationpolicy_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: notification-policy
spec:
  resyncPeriod: 1h
  instanceSelector:
    matchLabels:
      dashboards: grafana
  route:
    # Folders without a Rootly alert source of their own land on the o11y one.
    receiver: rootly-o11y
    group_by:
      - grafana_folder
      - alertname
      - cluster
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: rootly-heartbeat
        object_matchers:
          - ["heartbeat", "=", "rootly"]
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 2m
      - receiver: rootly-o11y
        object_matchers:
          - ["grafana_folder", "=", "o11y"]
      - receiver: rootly-yucca
        object_matchers:
          - ["grafana_folder", "=", "yucca"]
      - receiver: rootly-fmeet
        object_matchers:
          - ["grafana_folder", "=", "fmeet"]
      # The harbor bundle titles its folder "Harbor"; grafana_folder carries the
      # title, so match it case-insensitively rather than by the CR name.
      - receiver: rootly-harbor
        object_matchers:
          - ["grafana_folder", "=~", "(?i)^harbor$"]
      - receiver: rootly-fip
        object_matchers:
          - ["grafana_folder", "=", "fip"]
