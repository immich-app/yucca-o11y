---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafananotificationpolicy_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: notification-policy
spec:
  resyncPeriod: 1h
  instanceSelector:
    matchLabels:
      dashboards: grafana
  route:
    receiver: discord
    group_by:
      - grafana_folder
      - alertname
      - cluster
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: rootly-heartbeat
        object_matchers:
          - ["heartbeat", "=", "rootly"]
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 2m
      - receiver: discord
        object_matchers:
          - ["grafana_folder", "=", "yucca"]
      - receiver: discord
        object_matchers:
          - ["grafana_folder", "=", "o11y"]
