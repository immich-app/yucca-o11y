---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanacontactpoint_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: rootly-heartbeat
spec:
  resyncPeriod: 1h
  instanceSelector:
    matchLabels:
      dashboards: grafana
  name: rootly-heartbeat
  receivers:
    - type: webhook
      settings:
        httpMethod: POST
        authorization_scheme: Bearer
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: rootly-heartbeat
              key: url
        - targetPath: authorization_credentials
          valueFrom:
            secretKeyRef:
              name: rootly-heartbeat
              key: token
