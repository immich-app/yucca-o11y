---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanacontactpoint_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: rootly-heartbeat
spec:
  # Every resync re-PUTs the bearer token, which changes the stored
  # Alertmanager config and reloads it on all replicas. Edits to this CR or
  # its Secret still reconcile right away.
  resyncPeriod: 24h
  instanceSelector:
    matchLabels:
      dashboards: grafana
  name: rootly-heartbeat
  receivers:
    # Rootly counts any authenticated POST as a ping, so a resolve sent when
    # the heartbeat rule stops firing would push the expiry out.
    - type: webhook
      disableResolveMessage: true
      settings:
        httpMethod: POST
        authorization_scheme: Bearer
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: rootly-heartbeat
              key: url
        - targetPath: authorization_credentials
          valueFrom:
            secretKeyRef:
              name: rootly-heartbeat
              key: token
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanacontactpoint_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: rootly-heartbeat-remote
spec:
  # Same reload cost as rootly-heartbeat.
  resyncPeriod: 24h
  instanceSelector:
    matchLabels:
      dashboards: grafana
  name: rootly-heartbeat-remote
  receivers:
    # Rootly counts any authenticated POST as a ping, so a resolve sent when
    # the cluster goes silent would push the expiry out.
    - type: webhook
      disableResolveMessage: true
      settings:
        httpMethod: POST
        authorization_scheme: Bearer
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: rootly-heartbeat-remote
              key: url
        - targetPath: authorization_credentials
          valueFrom:
            secretKeyRef:
              name: rootly-heartbeat-remote
              key: token
