---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanafolder_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: o11y
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  title: o11y
  resyncPeriod: 10m
  permissions: |
    {
      "items": [
        {"role": "Viewer", "permission": 1},
        {"role": "Editor", "permission": 1}
      ]
    }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-operator
spec:
  folderRef: o11y
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 10m
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
  grafanaCom:
    id: 22785
