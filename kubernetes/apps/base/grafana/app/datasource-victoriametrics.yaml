---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-metrics
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    # The default datasource: routed through vmauth-self-select, which forces
    # extra_label=cluster onto every request, so anything that doesn't pick a
    # datasource explicitly only sees this cluster's own series. Same uid the
    # chart used, so existing dashboards and alerts resolve unchanged.
    name: VictoriaMetrics
    uid: VictoriaMetrics
    type: prometheus
    access: proxy
    isDefault: true
    url: http://vmauth-self-select.o11y.svc.cluster.local:8427/select/0/prometheus
