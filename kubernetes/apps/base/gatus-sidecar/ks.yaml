---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-sidecar
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-proxy
    - name: prometheus-operator-crds
    # The pod's netbird-egress annotation needs the NAD to exist to schedule.
    - name: multus-networks
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gatus-sidecar
      namespace: o11y
  interval: 1h
  path: ./kubernetes/apps/base/gatus-sidecar/app
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
