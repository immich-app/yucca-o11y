---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  interval: 1h
  values:
    fullnameOverride: victoria-metrics

    global:
      clusterLabel: cluster

    victoria-metrics-operator:
      env:
        - name: VM_GATEWAY_API_ENABLED
          value: "true"

    # The store is multi-tenant: without this filter every default rule
    # evaluates over the remote clusters' series too and re-emits the result
    # as o11y's own. Inert on chart >=0.85: sync-job v0.0.11 parses its config
    # with sigs.k8s.io/yaml, which drops the yaml-tagged/inline group spec
    # (helm-charts#3065), so the VMRules land without params. Kept so the
    # scoping returns with the upstream fix; until then the datasource-URL
    # filter on vmalert below does the same job one layer down.
    defaultRules:
      group:
        spec:
          params:
            extra_label: ["cluster=${CLUSTER_NAME}"]

    vmcluster:
      enabled: true
      spec:
        retentionPeriod: ${CLUSTER_VMETRICS_RETENTION}
        replicationFactor: 2
        vmstorage:
          replicaCount: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 6Gi
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vmstorage
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: openebs-spare-disk
                resources:
                  requests:
                    storage: 100Gi
        vmselect:
          replicaCount: 2
          resources:
            requests:
              cpu: 500m
              memory: 500Mi
            limits:
              memory: 1Gi
          extraArgs:
            dedup.minScrapeInterval: 20s
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vmselect
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: openebs-system-disk
                resources:
                  requests:
                    storage: 5Gi
        vminsert:
          replicaCount: 2
          resources:
            requests:
              cpu: 500m
              memory: 200Mi
            limits:
              memory: 500Mi
          extraArgs:
            replicationFactor: "2"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vminsert

    vmsingle:
      enabled: false

    vmagent:
      spec:
        externalLabels:
          project: o11y
          env: ${CLUSTER_ENV}
          cluster: ${CLUSTER_NAME}
          provider: ovh
          region: fr
        statefulMode: true
        statefulStorage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-system-disk
              resources:
                requests:
                  storage: 10Gi
        remoteWrite:
          - url: http://vminsert-victoria-metrics.o11y.svc.cluster.local:8480/insert/0/prometheus/api/v1/write
        extraArgs:
          promscrape.streamParse: "true"
          promscrape.dropOriginalLabels: "true"
          promscrape.maxScrapeSize: 50MiB

    vmalert:
      enabled: true
      spec:
        # Scope every rule evaluation to this cluster's series: vmalert keeps
        # query args from the datasource URL on all requests, and vmselect
        # enforces extra_label server-side. Covers what the (currently inert)
        # defaultRules group params above would do, including rule groups
        # added by future chart versions. Any deliberately fleet-wide rule
        # must live in Grafana alerting instead (like o11y-cluster-silent).
        datasource:
          url: http://vmselect-victoria-metrics.o11y.svc.cluster.local:8481/select/0/prometheus?extra_label=cluster=${CLUSTER_NAME}
        # No `cluster` here: rule results already carry it from the chart's
        # group-by, and an external label of the same name displaces theirs
        # to exported_cluster.
        externalLabels:
          project: o11y
          env: ${CLUSTER_ENV}
          provider: ovh
          region: fr
        # Alertmanager is stubbed off for now, so vmalert has no notifier. Blackhole
        # notifications — rules still evaluate (state visible in the vmalert UI /
        # recording rules still written) — until a real Alertmanager + receiver lands.
        extraArgs:
          notifier.blackhole: "true"
        remoteWrite:
          url: http://vminsert-victoria-metrics.o11y.svc.cluster.local:8480/insert/0/prometheus/api/v1/write
        remoteRead:
          url: http://vmselect-victoria-metrics.o11y.svc.cluster.local:8481/select/0/prometheus/

    alertmanager:
      enabled: false

    vmauth:
      enabled: true
      spec:
        port: "8427"
        replicaCount: 2
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmauth
        podDisruptionBudget:
          minAvailable: 1
        selectAllByDefault: true
        unauthorizedUserAccessSpec:
          disabled: true
        httpRoute:
          hostnames:
            - vmauth.${CLUSTER_APP_DOMAIN}
          parentRefs:
            - name: envoy
              namespace: envoy-system

    grafana:
      enabled: false
      forceDeployDatasource: true

    defaultDashboards:
      grafanaOperator:
        enabled: true
        spec:
          folderRef: o11y
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true

    defaultDatasources:
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true

    kubeControllerManager:
      service:
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeScheduler:
      service:
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeProxy:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
