---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  dependsOn:
    - name: grafana-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoria-metrics
      namespace: o11y
    - apiVersion: operator.victoriametrics.com/v1alpha1
      kind: VLDistributed
      name: victoria-logs
      namespace: o11y
  healthCheckExprs:
    - apiVersion: operator.victoriametrics.com/v1alpha1
      kind: VLDistributed
      current: status.updateStatus == 'operational'
      inProgress: status.updateStatus == 'expanding'
      failed: status.updateStatus == 'failed'
  interval: 1h
  path: ./kubernetes/apps/base/victoria-metrics/app
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
