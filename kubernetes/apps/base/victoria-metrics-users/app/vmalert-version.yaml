---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmalert_v1beta1.json
#
# Evaluates the version:* recording rules that immich-app/version ships in its
# bundle (base/tenants/version), against the version tenant only. o11y's own
# vmalert skips VMRules labelled o11y.futo.org/tenant (docs/06, "Recording
# rules in a bundle").
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: version
spec:
  selectAllByDefault: false
  # Without a namespace selector this looks in the o11y namespace only, where
  # the bundle's targetNamespace puts its VMRules. The second label is set by
  # kustomize-controller on everything version-o11y applies, so another bundle
  # cannot feed rules into this tenant.
  ruleSelector:
    matchLabels:
      o11y.futo.org/tenant: version
      kustomize.toolkit.fluxcd.io/name: version-o11y
  evaluationInterval: 1m
  datasource:
    url: http://vmselect-victoria-metrics.o11y.svc.cluster.local:8481/select/7:1/prometheus
  # The results go back through the tenant registry (configmap-vminsert-relabel),
  # which files project=version,cluster=version under 7:1. External labels
  # override a same-named label from the query result (kept as exported_<name>),
  # but a group's or rule's own `labels:` override them. The bundle must not set
  # identity labels there (immich-app/version's render script rejects them).
  remoteWrite:
    url: http://vminsert-victoria-metrics.o11y.svc.cluster.local:8480/insert/multitenant/prometheus/api/v1/write
  # version's identity labels (immich-app/version worker.tf). Its dev
  # deployment reports env=dev, which the staging overlay sets.
  externalLabels:
    project: version
    cluster: version
    env: ${CLUSTER_ENV}
    provider: cloudflare
    region: world
  extraArgs:
    # The chart sets this for its own vmalert; a bare VMAlert does not, and
    # vmalert would append a second /api/v1/write to the URL above.
    remoteWrite.disablePathAppend: "true"
    # Recording rules only, as on o11y's own vmalert.
    notifier.blackhole: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
