---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: glitchtip-postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generated in-cluster once (refreshInterval 0); nothing outside the cluster
# connects with it. No symbols, so the password needs no escaping in uri, which
# GlitchTip reads as DATABASE_URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-postgres-credentials
spec:
  refreshInterval: "0"
  target:
    name: glitchtip-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: glitchtip
        password: "{{ .password }}"
        uri: "postgres://glitchtip:{{ .password }}@glitchtip-postgres-rw.o11y.svc.cluster.local:5432/glitchtip?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: glitchtip-postgres
