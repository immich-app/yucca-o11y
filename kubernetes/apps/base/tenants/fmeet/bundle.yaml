---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fmeet-o11y
  namespace: flux-system
spec:
  interval: 1m
  url: oci://gitlab.futo.org:5050/devops/cloudflare/fmeet.futo.org/o11y-manifests
  ref:
    tag: main
  secretRef:
    name: fmeet-o11y-registry
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fmeet-o11y
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: fmeet-o11y
  path: ./
  patches:
    - target:
        kind: GrafanaFolder
      patch: |-
        - op: add
          path: /spec/permissions
          value: |
            {
              "items": [
                {"role": "Viewer", "permission": 1},
                {"role": "Editor", "permission": 1}
              ]
            }
  prune: true
  targetNamespace: o11y
  dependsOn:
    - name: grafana-operator
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fmeet-o11y-registry
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: fmeet-o11y-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"gitlab.futo.org:5050":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: FMEET_O11Y_REGISTRY_DEPLOY_TOKEN_USERNAME
    - secretKey: password
      remoteRef:
        key: FMEET_O11Y_REGISTRY_DEPLOY_TOKEN_PASSWORD
