---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: glitchtip-secret-key
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generated in-cluster once (refreshInterval 0): Django signs sessions with it,
# so a new value would only log everyone out, and nothing outside needs it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-secret-key
spec:
  refreshInterval: "0"
  target:
    name: glitchtip-secret-key
    template:
      data:
        SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: glitchtip-secret-key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-environment
  target:
    name: glitchtip-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: GLITCHTIP_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: GLITCHTIP_S3_SECRET_ACCESS_KEY
