---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: victoria-metrics
        spec:
          values:
            vmcluster:
              spec:
                vmstorage:
                  resources:
                    requests:
                      memory: 2Gi
                    limits:
                      memory: 8Gi
      target:
        kind: HelmRelease
        name: victoria-metrics
