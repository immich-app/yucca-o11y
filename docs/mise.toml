# Both paths have to reach outside this config_root: README.md is at the repo
# root, and markdownlint-cli2 resolves .markdownlint.json from its working
# directory, so without --config it silently loses the repo's MD013 = false.
[tasks.lint]
run = "markdownlint-cli2 --config $REPO_ROOT/.markdownlint.json '{{config_root}}/**/*.md' \"$REPO_ROOT/README.md\""
description = "Lint markdown docs"

[tasks.fix]
run = "markdownlint-cli2 --fix --config $REPO_ROOT/.markdownlint.json '{{config_root}}/**/*.md' \"$REPO_ROOT/README.md\""
description = "Auto-fix markdown lint issues where possible"
