[tasks.init]
extends = "tg:init"

[tasks.plan]
extends = "tg:plan"

[tasks.apply]
extends = "tg:apply"

[tasks.destroy]
extends = "tg:destroy"
wait_for = [
  "//deployment/modules/netbird/cluster:destroy",
  "//deployment/modules/netbox/cluster:destroy",
  "//deployment/modules/talos/cluster:destroy",
]

[tasks.output]
extends = "tg:output"

# Control plane and workers boot from different Talos Factory schematics:
#   control plane (Public Cloud / KVM): qemu-guest-agent + netbird
#   worker (bare metal):                netbird only — qemu-guest-agent wedges
#                                       bare-metal boot and reboot-loops the node
# Control planes need the image uploaded to OVH glance; workers are OVH BYOI, so
# OVH fetches their raw from the Factory at order time (no upload).
#
# Image facts (schematic, version, glance name, regions) come from this module's
# cp_image output: one source, no must-match with the module.
[tasks."image:download"]
run = """
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}" "${MISE_MONOREPO_ROOT:?}"
mkdir -p "$MISE_MONOREPO_ROOT/.private/dist"
CP_IMAGE=$({{vars.tg}} run -- output -json cp_image)
NAME=$(echo "$CP_IMAGE" | jq -r .glance_name)
wget "$(echo "$CP_IMAGE" | jq -r .download_url)" -O "$MISE_MONOREPO_ROOT/.private/dist/${NAME}.raw.xz"
unxz "$MISE_MONOREPO_ROOT/.private/dist/${NAME}.raw.xz" --force
"""
description = "Download the control-plane Talos image (OpenStack, from this module's cp_image output)"

[tasks."image:upload"]
run = """
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}" "${MISE_MONOREPO_ROOT:?}"
CP_IMAGE=$({{vars.tg}} run -- output -json cp_image)
NAME=$(echo "$CP_IMAGE" | jq -r .glance_name)
for region in $(echo "$CP_IMAGE" | jq -r '.regions[]'); do
  echo "Uploading ${NAME} to region ${region}..."
  source "$MISE_MONOREPO_ROOT/.private/openstack/${ENVIRONMENT}/openrc.sh"
  openstack image create "${NAME}" \
      --os-region "${region}" \
      --file "$MISE_MONOREPO_ROOT/.private/dist/${NAME}.raw" \
      --disk-format raw \
      --container-format bare \
      --property hw_qemu_guest_agent=yes \
      --property img_config_drive=mandatory \
      --shared \
      --progress
done
"""
description = "Upload the control-plane Talos image to the env's OVH OpenStack regions (control planes only)"
