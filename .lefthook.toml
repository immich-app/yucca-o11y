[pre-commit]
parallel = true
skip = ["merge", "rebase"]

# mise fmt rewrites the config in place, and a mise lock that reads it
# mid-rewrite prunes every tool from the lockfile, so the two run piped.
[[pre-commit.jobs]]
name = "mise"
glob = [".mise/config.toml"]

[pre-commit.jobs.group]
piped = true

[[pre-commit.jobs.group.jobs]]
name = "format-mise"
run = "mise fmt"
stage_fixed = true

[[pre-commit.jobs.group.jobs]]
name = "lock-mise"
run = 'mise lock && git add -A -- .mise ":(exclude).mise/*.toml"'

# oxfmt exits non-zero when every path it was given is ignored by
# .prettierignore, which would fail a commit of only ignored files.
[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
# Lock sidecars are digest-pinned in mise.lock; reformatting them breaks
# `mise install --locked`.
exclude = [".mise/locks/**"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
exclude = [".mise/locks/**"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.actionlint]
glob = [".github/workflows/*.yaml", ".github/workflows/*.yml"]
run = "actionlint -shellcheck= {staged_files}"

# Low findings are not blocking: CI tolerates them, and the open one
# (self-repository) wants the `$/` uses syntax that actionlint 1.7.12 rejects.
[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/workflows/*.yml", ".github/actions/**/action.yaml", ".github/actions/**/action.yml"]
# The org-*.yml workflows are synced from core-infra-tf and pass CI only with
# the org zizmor config, which this repo does not carry.
exclude = [".github/workflows/org-*.yml"]
run = "zizmor --offline --min-severity medium {staged_files}"
